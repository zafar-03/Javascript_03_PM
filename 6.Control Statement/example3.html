<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    


    <script>
        var flag = true;
alert("Welcome to My Calculator");

while (flag) {
    var num1 = Number(prompt("Enter Value1 :"));
    var num2 = Number(prompt("Enter Value2 :"));



    var choice = prompt("1. for Addition\n2. for Subtraction\n\nEnter Your Choice :");


        if (choice == "1")
             alert(`Addition of ${num1} and ${num2} : ${num1 + num2}`);
        else if(choice == "2")
             alert(`Subtraction is : ${num1 - num2}`);
        else
             alert("Please Enter Valid Operation !!");

    flag = confirm("Do you want to work again ?");
}
    </script>
</body>
</html>

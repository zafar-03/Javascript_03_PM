<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: gainsboro;
        }
        table{
            width: 80%;
            margin: auto;
            border-collapse: collapse;
        }
        th{
            background-color: rgb(61, 84, 84);
            color: lightcyan;
            font-family: calibri;
            font-size: 24px;
            padding: 8px 16px;
        }
        td{
            font-family: calibri;
            font-size: 18px;
            text-align: center;
            padding: 10px;
        }
        tr:nth-child(even){
            background-color: rgb(107, 133, 133);
        }
        tr:nth-child(odd){
            background-color: rgb(165, 185, 185);
        }
    </style>
</head>
<body>
    
    <table>
        <tr>
            <th>Sr No.</th>
            <th>State Name</th>
            <th>total Confirmed Cases</th>
            <th>deaths</th>
            <th>discharged</th>
        </tr>
        
    </table>

    <script>
        var index = 1;
       fetch("https://api.rootnet.in/covid19-in/stats/latest").then((response)=>{
           response.json().then((response2)=>{
                for (const element of response2.data.regional) {
                    var tr = document.createElement("tr");
                    var td1 = document.createElement("td");
                    var td2 = document.createElement("td");
                    var td3 = document.createElement("td");
                    var td4 = document.createElement("td");
                    var td5 = document.createElement("td");

                    td1.append(index++);
                    td2.append(element.loc);
                    td3.append(element.totalConfirmed);
                    td4.append(element.deaths);
                    td5.append(element.discharged);

                    tr.appendChild(td1);
                    tr.appendChild(td2);
                    tr.appendChild(td3);
                    tr.appendChild(td4);
                    tr.appendChild(td5);

                    document.querySelector("table").appendChild(tr);
                }
           });
       })
    </script>
</body>
</html>
